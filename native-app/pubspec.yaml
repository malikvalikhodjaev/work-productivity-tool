name: indicators_work
description: Indicators & Work Dashboard for Windows and Android.
publish_to: none
version: 0.1.40+42
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  sqlite3: ^3.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.2
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  audioplayers: ^6.8.1
  flutter_quill: ^11.6.0
  url_launcher: ^6.3.2
  file_selector_platform_interface: ^2.7.0
  file_selector_windows: ^0.9.3+6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
  assets:
    - assets/audio/
    - assets/audio/ringtones/
    - assets/art/
    - assets/iw.ico
    - assets/iw.png
    - assets/reflection-hints.json
    - assets/fonts/NotoSans-OFL.txt
    - assets/fonts/NotoSerif-OFL.txt
